<!DOCTYPE html>
<html lang="en">
  <head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<script data-ynext-studio-bootstrap>
(() => {
  const originalFetch = window.fetch.bind(window);
  const local = new URL('./', document.baseURI);
  window.fetch = async (input, options = {}) => {
    const request = typeof input === 'string' || input instanceof URL ? null : input;
    let url = new URL(request ? request.url : String(input), document.baseURI);
    const method = String(options.method || (request && request.method) || 'GET').toUpperCase();
    if (method !== 'GET' && method !== 'HEAD') throw new TypeError('Alleen lezen van lokale studio-assets is toegestaan');
    if (url.origin !== local.origin) throw new TypeError('Alleen lokale studio-assets zijn toegestaan');
    if (url.pathname === '/supporters.json' || url.pathname === local.pathname + 'supporters.json') {
      return new Response('[]', { headers: { 'Content-Type': 'application/json' } });
    }
    const name = url.pathname.split('/').pop();
    const font = /^z-cad-font-([a-z0-9_-]+)\.ttf$/i.exec(name);
    if (font) url = new URL('./fonts/' + font[1] + '.ttf', local);
    if (!url.pathname.startsWith(local.pathname)) throw new TypeError('Alleen lokale studio-assets zijn toegestaan');
    const forwarded = request ? new Request(url.href, request) : url.href;
    return originalFetch(forwarded, { ...options, credentials: 'omit' });
  };
})();
</script>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open CAD Studio</title>
    <link rel="icon" href="./logo-29f685e80faf44a.svg" integrity="sha384-UXj5sMkYqjB2B+rVsSaBA9apP+pceLJr6YLEqSfcY+P3xoU3gAJNhjynTiGMCMPh"/>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
      canvas { display: block; }

      /* Splash shown while the wasm bundle downloads and initializes. Removed
         once the app's canvas appears (see the observer script below). */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #1e1e1e;
        color: #cfcfcf;
        font-family: system-ui, sans-serif;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #loading.hide { opacity: 0; pointer-events: none; }
      #loading .title { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
      #loading .title span { color: #3399e6; }
      #loading .sub { font-size: 12px; color: #777; }
      #loading .spinner {
        width: 46px;
        height: 46px;
        border: 4px solid #2e2e2e;
        border-top-color: #3399e6;
        border-radius: 50%;
        animation: ocs-spin 0.9s linear infinite;
      }
      @keyframes ocs-spin { to { transform: rotate(360deg); } }
    </style>
    <!-- Trunk builds the wasm32 binary without the `solid3d` feature (no 3-D
         solid kernel / vtkio C deps on the web). See issue #45. -->
    
<script type="module">
import init, * as bindings from './OpenCADStudio-1562abfa2c78e4a3.js';
const wasm = await init({ module_or_path: './OpenCADStudio-1562abfa2c78e4a3_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <!-- Per-script Noto subsets, fetched lazily at runtime (one alphabet per
         file) so CAD text renders non-Latin scripts on the web. (#141) -->
    
  
<script type="module" src="domera-bridge.js"></script>
<link rel="modulepreload" href="./OpenCADStudio-1562abfa2c78e4a3.js" crossorigin="anonymous" integrity="sha384-D2xvIvr4gM22yspcEMTXXaPkuUXiUzyqWpCtI32+YT/285dMlBlqU1R1i88LnhZ5"><link rel="preload" href="./OpenCADStudio-1562abfa2c78e4a3_bg.wasm" crossorigin="anonymous" integrity="sha384-O1bj7eufnA70xybgEptOLKxO/qjmjq+j4kP/+OutjpDal57yrjfd0YXdNfWdnZpk" as="fetch" type="application/wasm"></head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div class="title">Open <span>CAD</span> Studio</div>
      <div class="sub">Loading…</div>
    </div>
    <script>
      // The app mounts a <canvas> into <body> when it's ready. Watch for it and
      // fade the splash out.
      (function () {
        const splash = document.getElementById("loading");
        const done = () => {
          if (!splash) return;
          splash.classList.add("hide");
          setTimeout(() => splash.remove(), 450);
        };
        if (document.querySelector("canvas")) return done();
        const obs = new MutationObserver(() => {
          if (document.querySelector("canvas")) {
            obs.disconnect();
            done();
          }
        });
        obs.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
